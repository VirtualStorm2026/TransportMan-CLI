name: Build Linux Binary

# Este disparador hace que el workflow sea 100% manual
on:
  workflow_dispatch:

jobs:
  build-linux:
    # Usa Ubuntu para generar un binario compatible con la mayoría de distros Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Compile with Pyinstaller
        run: |
          pyinstaller --onefile --name manager-linux manager.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-universal-binary
          path: release_linux/
